name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A branch pushed again has superseded its own run. The event is part of the
# group so a push on main and a pull request never cancel each other: a
# cancelled run keeps the name of the required check, and the ruleset would then
# see a cancelled CI next to the successful one and refuse the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs

      - uses: actions/upload-artifact@v7
        with:
          name: provider-jar
          path: target/*.jar
          if-no-files-found: error

  integration:
    name: Integration (Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest release the hook is known to exist in.
          - keycloak: '26.0.8'
          # Where the SPI option format changed to the double-dash spelling.
          - keycloak: '26.2.5'
          - keycloak: '26.7.3'
          # Tracks main, i.e. the future 27. Allowed to fail: it is a moving target,
          # and emailTemplate is an internal SPI with no stability guarantee.
          - keycloak: 'nightly'
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the built jar inside Keycloak ${{ matrix.keycloak }}
        run: >
          mvn -B verify
          -Dkeycloak.test.image=quay.io/keycloak/keycloak:${{ matrix.keycloak }}

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failsafe-reports-${{ matrix.keycloak }}
          path: target/failsafe-reports/

  # Single required check for the branch ruleset. The matrix job names carry the
  # Keycloak version, so requiring them by name would have to be updated in the
  # repository settings every time a version is added or dropped -- and a
  # required check that never reports blocks the merge forever. This one name is
  # stable whatever the matrix does.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [build, integration]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        run: |
          echo "build=${{ needs.build.result }} integration=${{ needs.integration.result }}"
          [ "${{ needs.build.result }}" = "success" ] || exit 1
          [ "${{ needs.integration.result }}" = "success" ] || exit 1
