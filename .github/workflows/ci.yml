name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run unit tests
        run: mvn -B verify -DskipITs

      - uses: actions/upload-artifact@v4
        with:
          name: provider-jar
          path: target/*.jar
          if-no-files-found: error

  integration:
    name: Integration (Keycloak ${{ matrix.keycloak }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest release the hook is known to exist in.
          - keycloak: '26.0.8'
          # Where the SPI option format changed to the double-dash spelling.
          - keycloak: '26.2.5'
          - keycloak: '26.7.3'
          # Tracks main, i.e. the future 27. Allowed to fail: it is a moving target,
          # and emailTemplate is an internal SPI with no stability guarantee.
          - keycloak: 'nightly'
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run the built jar inside Keycloak ${{ matrix.keycloak }}
        run: >
          mvn -B verify
          -Dkeycloak.test.image=quay.io/keycloak/keycloak:${{ matrix.keycloak }}

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports-${{ matrix.keycloak }}
          path: target/failsafe-reports/
